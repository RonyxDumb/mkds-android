name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        # The runner image has the Android SDK; add the exact NDK and CMake the build uses.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          # arm64: the game image (32-bit pointers) is built with GCC's ILP32 AArch64 target
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ninja-build
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: mkds-android-apk
          path: app/build/outputs/apk/release/*.apk
