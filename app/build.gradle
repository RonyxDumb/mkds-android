plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mkds.port'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.mkds.port'
        minSdk 26
        targetSdk 35
        versionCode 41
        versionName '0.41'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    // Two apps from the same sources: for phones and tablets, and for the Meta Quest headsets (the game on a screen
    // in VR, through OpenXR; 64-bit only). They install side by side.
    flavorDimensions 'device'
    productFlavors {
        phone {
            dimension 'device'
            ndk {
                // The game needs 32-bit pointers (see README).
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        quest {
            dimension 'device'
            applicationIdSuffix '.quest'
            ndk {
                abiFilters 'arm64-v8a'
            }
            externalNativeBuild {
                cmake {
                    arguments '-DQUEST=ON'
                }
            }
        }
    }

    buildFeatures {
        prefab true
        buildConfig true // the version in the shared log
    }

    // One key for every build (CI and local): Android installs an update only over an app signed with the same key,
    // and a different key forces an uninstall, which deletes the save file. The key is public on purpose (an
    // unofficial build anyone can make); MKDS_KEYSTORE etc. replace it with a private one.
    signingConfigs {
        release {
            storeFile file(System.getenv('MKDS_KEYSTORE') ?: 'keystore/release.jks')
            storePassword System.getenv('MKDS_KEYSTORE_PASSWORD') ?: 'mkdsport'
            keyAlias System.getenv('MKDS_KEY_ALIAS') ?: 'mkds'
            keyPassword System.getenv('MKDS_KEY_PASSWORD') ?: 'mkdsport'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    // Installed as files: the arm64 build runs libmkdsgame.so (the game process) from the native library directory.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    externalNativeBuild {
        cmake {
            path '../port/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // .xz decompression for xdelta patches (Mods, Vcdiff); public domain
    implementation 'org.tukaani:xz:1.9'
    questImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.47'
}
