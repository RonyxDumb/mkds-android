plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mkds.port'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.mkds.port'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '0.26'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    // Two apps from the same sources: for phones and tablets, and for the Meta Quest headsets (the game on a screen
    // in VR, through OpenXR; 64-bit only). They install side by side.
    flavorDimensions 'device'
    productFlavors {
        phone {
            dimension 'device'
            ndk {
                // The game needs 32-bit pointers (see README).
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        quest {
            dimension 'device'
            applicationIdSuffix '.quest'
            ndk {
                abiFilters 'arm64-v8a'
            }
            externalNativeBuild {
                cmake {
                    arguments '-DQUEST=ON'
                }
            }
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Installed as files: the arm64 build runs libmkdsgame.so (the game process) from the native library directory.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    externalNativeBuild {
        cmake {
            path '../port/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    questImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.47'
}
